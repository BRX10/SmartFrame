networks:
  smart-frame:
    driver: bridge

services:
  mongodb:
    image: 'bitnami/mongodb:4.4'
    container_name: 'SmartFrame-mongo_db'
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      TZ: "Europe/Paris"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok", "-u", "${MONGODB_USERNAME}", "-p", "${MONGODB_PASSWORD}", "--authenticationDatabase", "admin"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - smart-frame

  api-server:
    build:
      context: ./API
      dockerfile: Dockerfile.prod
      args:
        AUTH: ${TOKEN_API}
        HOST_SERVER: ${HOST_SERVER}
        PORT_SERVER: ${PORT_SERVER}
    image: smartframe/server-api
    container_name: 'SmartFrame-server_api'
    restart: always
    ports:
      - '0.0.0.0:18080:8080'
    environment:
      DATABASE_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8080
      SIGNUP_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8080),3); s.close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-frame

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile.prod
    image: smartframe/webapp
    container_name: 'SmartFrame-webapp'
    restart: always
    ports:
      - '127.0.0.1:8081:3000'
    depends_on:
      - api-server
    networks:
      - smart-frame
